spring:
  application:
    name: asteria
  datasource:
    url: jdbc:postgresql://localhost:5432/asteria
    username: postgres
    password: 123456
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:asteria-default}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis-plus:
  mapper-locations:
    - classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

asteria:
  id-generator:
    worker-id: 1
    datacenter-id: 1
  payment:
    outbox:
      publish-task-enabled: false
      publish-interval-ms: 1000
  settlement:
    outbox:
      publish-task-enabled: false
      publish-interval-ms: 1000

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-}] [%thread] %-5level %logger{36} - %msg%n'
